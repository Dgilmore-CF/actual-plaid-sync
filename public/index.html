<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actual Plaid Sync</title><script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script><link rel="stylesheet" href="/styles.css"></head><body><header><div class="brand">Actual Plaid Sync <small id="meta"></small></div><nav><button data-view="home" class="active">Home</button><button data-view="connections">Connections</button><button data-view="reviews">Review</button><button data-view="settings">Settings</button></nav><div class="actions"><button id="sync">Sync now</button><button id="link" class="primary">Add institution</button></div></header><main><section id="auth"><h1>Unlock the console</h1><p>Use the administrator token for this browser session.</p><input id="token" type="password"><button id="save" class="primary">Unlock</button></section><div id="notice"></div><section id="home" class="view active"><h1>Financial sync overview</h1><div id="metrics" class="metrics"></div><div id="homeAccounts" class="cards"></div></section><section id="connections" class="view"><div class="heading"><div><h1>Connections</h1><p>Connect, map, recover history, and monitor each institution.</p></div><div><input id="search" placeholder="Search institution, account, or mask"><select id="filter"><option value="all">All</option><option value="active">Active</option><option value="setup">Needs setup</option><option value="unmapped">Unmapped</option><option value="archived">Archived</option></select><button id="collapseAll">Collapse all</button><button id="expandAll">Expand all</button></div></div><div id="connectionList"></div></section><section id="reviews" class="view"><h1>Review queue</h1><div id="reviewList"></div></section><section id="settings" class="view"><h1>Settings and maintenance</h1><div id="system"></div><pre id="output">No operation has run.</pre></section></main><div id="modal" class="modal hidden"><form id="modalForm"><h2 id="modalTitle"></h2><p id="modalMessage"></p><label id="modalLabel" class="hidden"><span id="modalLabelText"></span><input id="modalInput"></label><div><button type="button" id="cancel">Cancel</button><button type="submit" id="confirm" class="primary">Continue</button></div></form></div><script type="module" src="/app.js"></script></body></html>
