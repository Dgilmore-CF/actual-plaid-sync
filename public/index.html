<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Actual Plaid Sync</title><script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script><style>body{font:16px system-ui;max-width:1200px;margin:32px auto;padding:0 20px;color:#18212b;background:#fafbfc}button,input,select{padding:9px;margin:4px;border:1px solid #adb5bd;border-radius:6px}.card{background:white;border:1px solid #d9dee3;border-radius:12px;padding:16px;margin:16px 0}.account{display:grid;grid-template-columns:1.5fr 1.5fr 2fr 1.5fr repeat(3,auto);gap:8px;align-items:center;padding:10px 0;border-top:1px solid #eee}.review{display:grid;grid-template-columns:2fr 2fr repeat(3,auto);gap:8px;align-items:center;padding:8px;border-top:1px solid #eee}.good{color:#067647}.bad{color:#b42318;font-weight:700}pre{background:#111827;color:#e5e7eb;padding:14px;overflow:auto;border-radius:8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:900px){.account,.review{grid-template-columns:1fr}}</style></head><body><h1>Actual Plaid Sync</h1><p>Map accounts, preview imports, reconcile balances, and resolve lifecycle reviews.</p><div class="card"><label>Administrator token <input id="token" type="password"></label><button id="save">Save for this session</button></div><div class="row"><button id="link">Connect institution</button><button id="refresh">Refresh</button><button id="sync">Sync now</button></div><div id="content"></div><pre id="output"></pre><script type="module" src="/app.js"></script></body></html>
